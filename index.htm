<html>
    <head>
        <title>CHAT ONLINE</title>
        <link rel="stylesheet" href="./src/assets/CSS/ui--kit.css" />
        <link rel="stylesheet" href="./src/assets/CSS/style.css" />
        <script src="./src/script/script.js"></script>
    </head>
    <body>
        <div class="flex flex--direction--row container">
            <div class="flex flex--direction--column flex--1 left--bar">
                <div class="flex flex--direction--row Menu">
                    <div class="flex justify--content--center  align--items--center flex--1">
                        <img src="./src/assets/icons/Menu Icon.png" />
                    </div>
                    <div class="flex justify--content--center align--items--center flex--4 search">
                        <div class="flex align--items--center background--color--light--grey div--search">
                            <img src="./src/assets/icons/search icon.png" />
                            <input type="search" placeholder="search-contact" />
                        </div>
                    </div>
                </div>
                <div class="flex flex--direction--column div--contact">
                </div>
            </div>
            <div class="flex flex--direction--column align--items--start flex--3-5">
                <!--sidebar-->
                <div class="flex flex--direction--row align--items--center side--bar">
                    <div class="flex flex--direction--row align--items--center justify--content--center flex--1">
                        <img src="./src/assets/images/Avatar-2.png " width="40" />
                    </div>
                    <div class="flex flex--direction--column flex--13">
                        <div class="contact--name">David Moore</div>
                        <div class="contact--status">last seen 5 mins ago</div>
                    </div>
                    <div class="flex flex--direction--row flex--3 justify--content--end align--items--center div--sidebar--icons">                        
                        <div class="flex align--items--center background--color--light--grey div--search">
                            <img src="./src/assets/icons/search icon.png" />
                            <input type="search" placeholder="search-message" id="search-message" />
                        </div>
                        <img src="./src/assets/icons/Call Icon.png" />
                        <img src="./src/assets/icons/More Icon.png" />
                    </div>
                </div>
                <!--message-->
                <div class="flex flex--direction--row background--messages width--100">
                    <div class="flex flex--direction--column div--container--messages width--100"> 
                        <div class="flex flex--direction--column flex--6 justify--content--end width--100">
                            <div class="flex flex--direction--column align--items--center justify--content--center width--100 div--message">
                                <div class="date--chat flex justify--content--center align--items--center">
                                    Today
                                </div>
                                <div class="flex flex--direction--row justify--content--start width--100">
                                    <div class="flex flex--direction--column message other">
                                        <div class="flex--4">   
                                            OMG 😲 do you remember what you did last night at the work night out?
                                        </div>
                                        <div class="flex--1 flex flex--direction--row justify--content--end align--items--center font--size--12 infos--message" >
                                            <img src="./src/assets/icons/heart.png" />
                                            <div>18:12</div>
                                            <img src="./src/assets/icons/viewed.png">
                                        </div> 
                                    </div>
                                </div>
                                <div class="flex flex--direction--row width--100 justify--content--end">
                                    <div class="flex flex--direction--column message you">
                                        <div class="flex--4">   
                                            no haha
                                        </div>
                                        <div class="flex--1 flex flex--direction--row justify--content--end align--items--center font--size--12 infos--message" >
                                            <div>18:16</div>
                                            <img src="./src/assets/icons/viewed.png">
                                        </div> 
                                    </div>
                                </div>
                                <div class="flex flex--direction--row width--100 justify--content--end">
                                    <div class="flex flex--direction--column message you">
                                        <div class="flex--4">   
                                            i don't remember anything 😄
                                        </div>
                                        <div class="flex--1 flex flex--direction--row justify--content--end align--items--center font--size--12 infos--message" >
                                            <div>18:16</div>
                                            <img src="./src/assets/icons/viewed.png">
                                        </div> 
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex--direction--row align--items--center flex--1">
                            <div class="flex flex--direction--row div--flex--field">
                                <div class="flex justify--content--center align--items--center flex--1">
                                    <img src="./src/assets/icons/Emoji Icon.png" class="cursor--pointer" />
                                </div>
                                <div class="flex--13">
                                    <input type="text" id="InputMenssage" class="text--field" />
                                </div>
                                <div class="flex justify--content--center align--items--center flex--1">
                                    <img src="./src/assets/icons/Send Icon.png" class="cursor--pointer"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
